name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag points to main
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag is not a valid Docker image tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Release tag must point to the current main commit" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test .NET solution (Release)
        run: dotnet test Bolt.slnx --configuration Release

      - name: Test Web (Debug)
        run: dotnet test tests/Bolt.Web.Tests/Bolt.Web.Tests.fsproj --configuration Debug

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Test Python analytics
        working-directory: python-analytics
        run: uv run --python 3.12 --frozen pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      WEB_IMAGE: dzikikitty/bolt-sharp-web
      ANALYTICS_IMAGE: dzikikitty/bolt-sharp-analytics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_API_KEY: ${{ secrets.DOCKERHUB_API_KEY }}
        run: |
          : "${DOCKERHUB_API_KEY:?Missing GitHub Actions secret DOCKERHUB_API_KEY}"
          printf '%s' "$DOCKERHUB_API_KEY" | docker login --username dzikikitty --password-stdin

      - name: Build web image
        run: docker build --platform linux/amd64 -t "$WEB_IMAGE:$RELEASE_TAG" -t "$WEB_IMAGE:latest" -f Dockerfile .

      - name: Build analytics image
        run: docker build --platform linux/amd64 -t "$ANALYTICS_IMAGE:$RELEASE_TAG" -t "$ANALYTICS_IMAGE:latest" -f python-analytics/Dockerfile python-analytics

      - name: Push images
        run: |
          docker push "$WEB_IMAGE:$RELEASE_TAG"
          docker push "$WEB_IMAGE:latest"
          docker push "$ANALYTICS_IMAGE:$RELEASE_TAG"
          docker push "$ANALYTICS_IMAGE:latest"

      - name: Attach deployment package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="bolt-sharp-deploy-$RELEASE_TAG.zip"
          zip "$archive" compose.release.yaml nginx/http.conf nginx/https.conf nginx/start.sh nginx/certbot.sh
          gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
