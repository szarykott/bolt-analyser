services:
  web:
    image: dzikikitty/bolt-sharp-web:${BOLT_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Analytics__BaseUrl: http://analytics:8000
    ports:
      - "[::]:${BOLT_PORT:-8080}:8080"
    depends_on:
      analytics:
        condition: service_healthy

  analytics:
    image: dzikikitty/bolt-sharp-analytics:${BOLT_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
