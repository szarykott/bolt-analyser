services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    command: ["/bin/sh", "/etc/nginx/bolt/start.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/bolt:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/certbot.sh"]
    environment:
      LETSENCRYPT_DOMAIN: szarykott.dev
      LETSENCRYPT_EMAIL: radoslaw.edward.kot@gmail.com
    volumes:
      - ./nginx/certbot.sh:/opt/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    depends_on:
      - nginx

  web:
    image: dzikikitty/bolt-sharp-web:${BOLT_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Analytics__BaseUrl: http://analytics:8000
    depends_on:
      analytics:
        condition: service_healthy

  analytics:
    image: dzikikitty/bolt-sharp-analytics:${BOLT_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  letsencrypt:
  acme-webroot:
