map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name szarykott.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://szarykott.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name szarykott.dev;

    ssl_certificate /etc/letsencrypt/live/bolt-analyser/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolt-analyser/privkey.pem;

    location = /bolt-analyser {
        return 308 /bolt-analyser/;
    }

    location /bolt-analyser/ {
        proxy_pass http://web:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
