[project]
name = "analytics"
version = "0.1.0"
description = "Statistical analytics service and CLIs for bolt-sharp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.scripts]
st-dbscan = "analytics.cli.st_dbscan:main"
linear-regression = "analytics.cli.linear_regression:main"
mirror-check = "analytics.cli.mirror_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
